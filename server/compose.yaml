# Local Bot API server (files up to 2 GB, exchanged by path) + the bot. Nothing is exposed to the internet:
# both only talk out to Telegram. Secrets live in .env next to this file (see .env.example).
x-logs: &logs # logs must not fill the disk
  driver: json-file
  options: { max-size: 10m, max-file: "3" }
services:
  bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    logging: *logs
    env_file: .env
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - data:/var/lib/telegram-bot-api
  bot:
    build: .
    restart: unless-stopped
    init: true # reaps whatever a killed worker leaves behind, and stops at once on SIGTERM
    logging: *logs
    healthcheck: # the bot touches this file after every answer from Telegram; heal.sh restarts it when it stops
      test: ["CMD-SHELL", "test -n \"$(find /var/lib/telegram-bot-api/work/alive -mmin -2 2>/dev/null)\""]
      interval: 20s
      timeout: 10s
      retries: 2
      start_period: 90s
    env_file: .env
    environment:
      BOT_API: http://bot-api:8081
      WORK_DIR: /var/lib/telegram-bot-api/work
      DB_FILE: /var/lib/telegram-bot-api/unmeta.db
    volumes:
      - data:/var/lib/telegram-bot-api
    depends_on:
      - bot-api
  net-meter: # Telegram reports no progress on files; the Bot API server's traffic does. Apart from it, so nothing depends on this.
    image: busybox:stable
    restart: unless-stopped
    logging: *logs
    network_mode: service:bot-api
    depends_on:
      - bot-api
    volumes:
      - data:/var/lib/telegram-bot-api
    command: ["sh", "-c", "cd /var/lib/telegram-bot-api/work && while sleep 1; do cp /proc/net/dev net.new && mv net.new net; done"]
volumes:
  data:
