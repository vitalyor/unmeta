<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unmeta · A · Протокол</title>
<!-- Mockup only: product will self-host subsetted fonts, zero network requests. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:slnt,wght,CRSV,SHRP@-12..0,100..900,0..1,0..100&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* A · «Протокол»: точный инструмент. Холодная бумага, кобальт, отчёт как протокол — каждая строка зачёркивается линейкой. */
:root {
  --bg: #F3F4F6; --surface: #FFFFFF; --surface-2: #E8EAEE; --ink: #0E1116; --muted: #545B66;
  --line: #E1E4E9; --line-strong: #C5CAD2; --hover: rgba(14,17,22,.06);
  --accent: #1F3FD6; --on-accent: #FFFFFF; --accent-soft: #E6EAFC; --danger: #B42318; --ok: #18794E; --on-ok: #fff;
  --font-text: 'Geologica', system-ui, sans-serif; --font-display: 'Geologica', system-ui, sans-serif;
  --r-btn: 12px; --r-card: 18px;
}
[data-theme="dark"] {
  --bg: #0D0F13; --surface: #161A20; --surface-2: #1F242C; --ink: #ECEEF2; --muted: #9AA2AE;
  --line: #242A33; --line-strong: #39414D; --hover: rgba(236,238,242,.07);
  --accent: #8DA2FF; --on-accent: #0D0F13; --accent-soft: #1C2440; --danger: #FF8A7A; --ok: #5CD49A; --on-ok: #0D0F13;
}
body { font-variation-settings: "SHRP" 0; font-feature-settings: "tnum" 0; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); position: relative; overflow: hidden; }
.brand-mark::after { content: ''; position: absolute; left: 4px; right: 4px; top: 10px; height: 2px; background: var(--bg); }
.brand-name { font-variation-settings: "SHRP" 100; letter-spacing: -.01em; font-size: 1.05rem; }

/* Start: asymmetric split — statement left, instrument right */
.hero { container-type: inline-size; }
.s-start { display: grid; gap: 28px; padding-block: clamp(16px, 5vh, 72px) 24px; }
.hero-title { font-family: var(--font-display); font-variation-settings: "SHRP" 100; font-weight: 340; font-size: clamp(2.3rem, 1.2rem + 4.6vw, 5.6rem); font-size: clamp(2.2rem, 13.5cqi, 5.6rem); line-height: .98; letter-spacing: -.045em; margin: 0; max-width: 13ch; text-wrap: balance; }
.hero-sub { color: var(--muted); font-size: clamp(1rem, .95rem + .3vw, 1.2rem); max-width: 46ch; margin: 22px 0 0; text-wrap: pretty; }
.drop { position: relative; background: var(--surface); border-radius: var(--r-card); min-height: 300px; display: grid; place-items: center; text-align: center; padding: 36px 24px; isolation: isolate; transition: transform .3s var(--ease); }
.drop::before { content: ''; position: absolute; inset: 10px; border-radius: 12px; border: 1.5px dashed var(--line-strong); transition: border-color .2s, transform .35s var(--ease-out); z-index: -1; }
.drop:hover::before { border-color: var(--accent); }
body.dragging .drop { transform: scale(1.015); }
body.dragging .drop::before { border-color: var(--accent); border-style: solid; transform: scale(.985); }
.drop-inner { display: grid; justify-items: center; gap: 10px; }
.drop-icon { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.drop-icon .ic { width: 26px; height: 26px; }
body.dragging .drop-icon { animation: bob .8s var(--ease) infinite alternate; }
@keyframes bob { to { transform: translateY(-6px); } }
.drop-title { font-weight: 500; font-size: 1.12rem; margin: 6px 0 0; }
.drop-or, .drop-hint { color: var(--muted); font-size: .88rem; margin: 0; }
.start-extra { display: grid; gap: 6px; align-content: start; }
.privacy-line { display: flex; gap: 10px; align-items: flex-start; margin: 0; font-size: .92rem; }
.privacy-line .ic { color: var(--ok); margin-top: .1em; }
.what summary { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; font-weight: 500; }
.what p { color: var(--muted); max-width: 60ch; margin: 0 0 8px; font-size: .92rem; }
.start-extra .link-btn { justify-self: start; color: var(--accent); }
@media (min-width: 900px) {
  .s-start { grid-template-columns: 1.15fr 1fr; grid-template-rows: auto auto; column-gap: clamp(32px, 5vw, 96px); align-items: stretch; }
  .hero { grid-row: 1; align-self: end; }
  .drop { grid-column: 2; grid-row: 1 / span 2; min-height: 460px; }
  .start-extra { grid-row: 2; }
}
@media (max-width: 640px) {
  .drop { min-height: 0; padding: 28px 20px; }
  .drop .drop-title, .drop .drop-or { display: none; }  /* phone: no drag & drop — a big button that opens the gallery */
  .drop-inner .btn-pick { width: 100%; }
}

/* Intro: one orchestrated moment — title lines rise, instrument slides in */
body.intro:not(.no-intro) .hero-title { animation: rise .7s var(--ease-out) both; }
body.intro:not(.no-intro) .hero-sub { animation: rise .7s var(--ease-out) .08s both; }
body.intro:not(.no-intro) .drop { animation: slide-in .8s var(--ease-out) .12s both; }
@keyframes slide-in { from { opacity: 0; transform: translateX(24px); } }

/* Report: protocol list + instrument panel */
.s-report, .s-after, .s-batch { display: grid; gap: 20px; padding-block: 8px 24px; align-items: start; }
@media (min-width: 1000px) {
  .s-report, .s-after, .s-batch { grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); column-gap: clamp(24px, 3vw, 56px); }
  .pane-act { position: sticky; top: 24px; }
  .s-report .modes { display: block; }           /* desktop: modes always visible, next to the button */
  .s-report .pane-act .mode-chip { display: none; }
}
.pane-file { background: var(--surface); border-radius: var(--r-card); padding: clamp(18px, 2.4vw, 36px); }
.sec-title { font-variation-settings: "SHRP" 100; font-weight: 400; font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.6rem); letter-spacing: -.035em; line-height: 1.05; margin: 28px 0 6px; }
.summary { color: var(--muted); margin: 0 0 18px; }
.finds { border-top: 1px solid var(--line); }
.find { padding: 16px 0; border-bottom: 1px solid var(--line); }
.find-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); transition: background-color .3s, color .3s; }
.find.cat-location .find-icon { background: var(--accent); color: var(--on-accent); }
.find-text { font-weight: 500; }
.find-ev { color: var(--ink); font-size: .92rem; }
.find-state { color: var(--muted); padding-top: 8px; }
.find.is-remove .find-state { color: var(--accent); }
.find.is-keep .find-text { color: var(--muted); }
.find-why { max-width: 58ch; }
/* the strike: a ruler line drawn through the value that gets removed */
.redact { position: absolute; left: -2px; right: -2px; top: 54%; height: 1.5px; background: var(--ink); transform-origin: left; transform: scaleX(0); }
.view-after .find.is-remove .redact { transform: scaleX(1); transition: transform .42s var(--ease) calc(var(--i) * 45ms); }
.view-after .find.is-remove .ev-val, .view-after .find.is-remove .find-why { opacity: .4; transition: opacity .3s calc(var(--i) * 45ms + .2s); }
.view-after .find.is-remove .find-icon { background: var(--surface-2); color: var(--muted); }
.view-after .find.is-remove .find-state { color: var(--ok); }
.view-before .find-state { visibility: hidden; }
.erasing .view-after .find.is-remove .redact { animation: draw .5s var(--ease) both; animation-delay: calc(var(--i) * 120ms + .35s); }
.erasing .view-after .find.is-remove .ev-val { animation: dim .35s ease both; animation-delay: calc(var(--i) * 120ms + .6s); }
.erasing .view-after .find.is-remove .find-state { animation: rise .3s var(--ease-out) both; animation-delay: calc(var(--i) * 120ms + .7s); }
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes dim { from { opacity: 1; } to { opacity: .4; } }
.s-after .find-text { font-weight: 600; }
.s-after .find-ev { font-size: 1rem; }
.find-state .ic { width: 1em; height: 1em; stroke-width: 2.4; }

/* Mode panel: instrument card */
.modes { background: var(--surface); border-radius: var(--r-card); padding: 18px; margin-bottom: 12px; }
.modes-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; padding: 0 4px; }
.modes-label { font-weight: 600; }
.modes-note { color: var(--muted); font-size: .8rem; }
.mode-list { display: grid; gap: 4px; }
.mode { position: relative; padding: 12px; border-radius: 12px; transition: background-color .2s; }
.mode:hover { background: var(--hover); }
.mode-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); transition: background-color .25s, color .25s; }
.mode-name { font-weight: 500; }
.mode.is-on { background: var(--accent-soft); }
.mode.is-on .mode-icon { background: var(--accent); color: var(--on-accent); animation: pop .4s var(--ease-out); }
.mode::after { content: ''; position: absolute; right: 14px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 99px; background: var(--accent); transform: scale(0); transition: transform .3s var(--ease-out); }
.mode.is-on::after { transform: scale(1); }
.custom { padding: 6px 12px 4px; }
.act-row { display: flex; gap: 8px; }
.act-row .btn-clean { flex: 1; }
.mode-chip { background: var(--surface); }
@media (max-width: 999px) { .modes.is-open { animation: rise .3s var(--ease-out); } }

/* After */
.newname { font-variation-settings: "SHRP" 100; }
.arrow { color: var(--muted); }
.done-head { margin: 24px 0 18px; }
.done-head .sec-title { margin: 0; }
.done-head .summary { margin: 2px 0 0; }
.ba { background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
.ba-pill { inset: 4px calc(50% + 0px) 4px 4px; background: var(--surface); border-radius: 9px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.view-after .ba-pill { transform: translateX(calc(100% - 4px)); }
.ba [aria-selected="false"] { color: var(--muted); }
.get { background: var(--surface); border-radius: var(--r-card); padding: 22px; display: grid; gap: 10px; }
.get .btn-get { width: 100%; }
.get-hint { margin: 0; font-size: .88rem; overflow-wrap: anywhere; }
.get-safe { margin: 0; color: var(--muted); font-size: .88rem; }
.get .btn-quiet { justify-self: start; padding: 0 .6em; }

/* Batch */
.batch-head .sec-title { margin-top: 4px; }
.brow { border-top: 1px solid var(--line); }
.chip { background: var(--surface-2); }
.chip.cat-location { background: var(--accent-soft); color: var(--accent); }
.brow.is-skip .file-name { color: var(--muted); }
.st-ok { color: var(--ok); }
.batch-act { background: var(--surface); border-radius: var(--r-card); padding: 20px; display: grid; gap: 10px; }
.batch-act .btn { width: 100%; }
.s-batch .pane-act > .mode-chip { width: 100%; margin-bottom: 10px; }
.s-batch .link-btn { margin-top: 10px; color: var(--accent); }
@media (max-width: 640px) {
  .brow { grid-template-columns: auto minmax(0, 1fr) auto; }
  .brow-status { grid-column: 2 / -1; justify-self: start; }
  .brow .icon-btn { grid-column: 3; grid-row: 1; }
  .chips { justify-content: flex-start; }
  .dock .all-hint { display: none; }
}

/* Messages */
.s-msg { display: grid; place-items: start center; padding-block: clamp(16px, 8vh, 120px) 24px; }
.msg { width: min(100%, 640px); background: var(--surface); border-radius: var(--r-card); padding: clamp(22px, 3vw, 44px); }
.msg .sec-title { margin-top: 26px; }
.msg-body { margin: 10px 0 0; font-size: 1.05rem; max-width: 52ch; }
.msg-meta { color: var(--muted); font-size: .88rem; }
.msg-tip { background: var(--surface-2); padding: 14px 16px; border-radius: 12px; }
.big-progress { margin-top: 24px; }
.bp-track { height: 6px; }
.bp-pct { font-variation-settings: "SHRP" 100; font-weight: 300; font-size: 3rem; letter-spacing: -.04em; line-height: 1; }
.s-large .done-head { margin-top: 24px; }
</style>
</head>
<body>
<div id="app"></div>
<script>window.DIR = { name: 'A · Протокол' };</script>
<script src="copy.js"></script>
<script src="shared.js"></script>
</body>
</html>
