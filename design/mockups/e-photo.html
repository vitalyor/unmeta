<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unmeta · E · Фото и текст</title>
<!-- Mockup only: product will self-host subsetted fonts, zero network requests. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&family=Unbounded:wght@500..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* E · «Фото и текст». Главный образ — ваше же фото, крупно. Всё, что в нём нашли, — спокойным текстом рядом
   (протокол из D с маркером), без наклеек поверх фото: длинный текст просто переносится. Токены, шрифты, иконки — из D. */
:root {
  --bg: #E8EEED; --surface: #FFFFFF; --surface-2: #DCE5E4; --ink: #0E1C1F; --muted: #4B5C60;
  --line: #E0E7E6; --line-strong: #B9C7C7; --hover: rgba(14,28,31,.06);
  --accent: #0A5F73; --on-accent: #FFFFFF; --accent-soft: #D3E6EA;
  --warm: #9A4A0B; --on-warm: #FFFFFF; --warm-soft: #F8E7D2; --mark: #FAE8CF; --on-mark: #0E1C1F;
  --danger: #B3261E; --ok: #1F7A4D; --on-ok: #fff;
  --font-text: 'Onest', system-ui, sans-serif; --font-display: 'Unbounded', system-ui, sans-serif;
  --r-btn: 999px; --r-card: 28px; --r-photo: 30px; --maxw: 1280px;
  --shadow: 0 1px 0 rgba(14,28,31,.04), 0 24px 48px -36px rgba(14,28,31,.35);
}
[data-theme="dark"] {
  --bg: #0B1517; --surface: #132124; --surface-2: #1B2D31; --ink: #E6F0F1; --muted: #9AAFB3;
  --line: #20343A; --line-strong: #36505A; --hover: rgba(230,240,241,.07);
  --accent: #7DCFE0; --on-accent: #0B1517; --accent-soft: #173840;
  --warm: #F2A65A; --on-warm: #132124; --warm-soft: #33261A; --mark: #4A3418; --on-mark: #F6E7D3;
  --danger: #FF9C92; --ok: #6EDAA4; --on-ok: #0B1517;
  --shadow: 0 0 0 1px var(--line);
}
.brand-mark { width: 24px; height: 24px; border-radius: 8px; background: var(--accent); position: relative; }
.brand-mark::after { content: ''; position: absolute; left: 6px; right: 6px; top: 11px; height: 2.5px; border-radius: 2px; background: var(--bg); }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: .98rem; letter-spacing: -.01em; }
.btn { min-height: 56px; font-size: 1.02rem; }
.btn-primary { box-shadow: 0 10px 22px -12px color-mix(in srgb, var(--accent) 80%, transparent); }
#main { width: min(100% - 2 * var(--gutter), var(--maxw)); }
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); }

/* ---------- The photo ---------- */
.photo { position: relative; margin: 0; aspect-ratio: 4 / 3; border-radius: var(--r-photo); overflow: hidden; background: var(--surface-2); box-shadow: 0 40px 80px -50px rgba(14,28,31,.7); }
.photo > img, .photo > svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); transform: translateX(-110%); }
.cleaning .photo::after { animation: wash 1.1s var(--ease) infinite; }
.erasing .s-after .photo::after { animation: wash 1.3s var(--ease) .2s both; }
@keyframes wash { to { transform: translateX(110%); } }
.file-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px 6px 0; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.file-line b { color: var(--ink); font-weight: 600; }
.file-line .ic { width: 1em; height: 1em; }

/* ---------- Start: statement + the photo with what it hides, as text ---------- */
.s-start { display: grid; gap: 26px; padding-block: clamp(8px, 4vh, 56px) 24px; align-items: center; }
.hero { container-type: inline-size; }
.hero-title { font-family: var(--font-display); font-weight: 500; letter-spacing: -.03em; line-height: 1.07; margin: 0; max-width: 14ch; text-wrap: balance;
  font-size: clamp(1.75rem, 1rem + 3vw, 4rem); font-size: clamp(1.7rem, 10cqi, 4.2rem); }   /* fits its own column: no clipping at any width */
.hero-sub { color: var(--muted); font-size: clamp(1rem, .95rem + .3vw, 1.16rem); margin: 16px 0 0; max-width: 44ch; text-wrap: pretty; }
.hero-act { display: grid; justify-items: start; gap: 8px; margin-top: 26px; }
.hero-act .hint { color: var(--muted); font-size: .88rem; margin: 0; }
.hero-act .pick-files { color: var(--accent); }
.stage { position: relative; cursor: pointer; border-radius: calc(var(--r-photo) + 10px); transition: transform .35s var(--ease-out); }
.stage::after { content: ''; position: absolute; inset: -10px; border-radius: inherit; border: 2px dashed var(--accent); opacity: 0; transition: opacity .2s; pointer-events: none; }
body.dragging .stage { transform: scale(1.015); }
body.dragging .stage::after { opacity: 1; }
/* the label card: what a phone writes into this photo — plain text that wraps, however long */
.label { position: relative; z-index: 1; margin: -64px 18px 0; padding: 16px 18px 6px; border-radius: 22px; background: var(--surface); box-shadow: 0 24px 50px -28px rgba(14,28,31,.5); }
.label-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 6px; }
.label-name { font-weight: 600; }
.label-note { color: var(--muted); font-size: .82rem; }
.label dl { margin: 0; }
.label-row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: .92rem; }
.label dt { color: var(--muted); }
.label dd { margin: 0; }
.label dd span { background: var(--mark); color: var(--on-mark); border-radius: 4px; padding: 1px 4px; margin-left: -4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
body.intro:not(.no-intro) .label-row { animation: rise .5s var(--ease-out) both; animation-delay: calc(var(--i) * 110ms + .35s); }
.start-extra { display: grid; gap: 2px; }
.privacy-line { display: flex; gap: 10px; align-items: flex-start; margin: 0; font-size: .93rem; }
.privacy-line .ic { color: var(--accent); margin-top: .12em; }
.what summary { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; font-weight: 500; }
.what p { color: var(--muted); margin: 0 0 8px; font-size: .93rem; max-width: 60ch; }
.start-extra .link-btn { justify-self: start; color: var(--accent); }
.start-extra .pick-files { color: var(--accent); }
@media (min-width: 900px) {
  .s-start { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: clamp(32px, 5vw, 88px); }
  .s-start .stage { grid-column: 2; grid-row: 1 / span 2; }
  .s-start .hero { align-self: end; }
  .s-start .start-extra { align-self: start; }
}
@media (max-width: 640px) {
  .s-start .stage { margin-top: 4px; }   /* phone: headline first, the photo explains right under it; the button sits in the dock */
  .s-start .photo { aspect-ratio: 16 / 10; border-radius: 24px; }
  .label { margin: -36px 10px 0; padding: 12px 14px 2px; font-size: .92rem; }
  .label-row:nth-child(n + 4) { display: none; }   /* phone: three rows are enough, the headline must stay close */
  .label-row { grid-template-columns: 1fr; padding: 8px 0; }
  .label-note { display: none; }
  .s-start .hero-act .btn-pick, .s-start .hero-act .hint { display: none; }
  .s-start .dock { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .s-start .dock .hint { margin: 0; text-align: center; color: var(--muted); font-size: .82rem; }
  .hero-act { margin-top: 14px; }
}
body.intro:not(.no-intro) .s-start .hero { animation: rise .7s var(--ease-out) both; }

/* ---------- Report / after: photo left, text right ---------- */
.s-report, .s-after { display: grid; gap: 18px; padding-block: 4px 24px; align-items: start; }
@media (min-width: 1000px) {
  .s-report, .s-after { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); column-gap: clamp(28px, 4vw, 64px); }
  .s-report .pane-file, .s-after .pane-file { position: sticky; top: 20px; }
}
@media (max-width: 999px) { .s-report .photo, .s-after .photo { aspect-ratio: auto; height: min(42vh, 440px); } }   /* tablet/phone: the photo never pushes the list off screen */
@media (max-width: 640px) { .s-report .photo, .s-after .photo { height: min(34vh, 260px); border-radius: 24px; } }
.sec-title { font-weight: 700; font-size: clamp(1.6rem, 1.15rem + 1.5vw, 2.4rem); letter-spacing: -.03em; line-height: 1.08; margin: 0 0 6px; }
.summary { color: var(--muted); margin: 0 0 18px; }
/* findings: D's protocol, values marked */
.list { padding: 4px clamp(16px, 2vw, 24px) 14px; }
.finds { border-top: 0; }
.find { padding: 14px 0; border-bottom: 1px solid var(--line); }
.find:last-child { border-bottom: 0; }
.find-icon { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); transition: background-color .3s, color .3s; }
.find.cat-location .find-icon { background: var(--warm); color: var(--on-warm); }
.find-text { font-weight: 600; }
.find-ev { justify-self: start; padding: 0 4px; margin: 1px 0 1px -4px; isolation: isolate; font-size: .94rem; overflow-wrap: anywhere; }
.find-ev::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 5px; background: var(--mark); transform-origin: left; transform: scaleX(0); transition: transform .45s var(--ease); }
.s-report .find.is-remove .find-ev::before, .view-before .find.is-remove .find-ev::before { transform: scaleX(1); }
.s-report .find.is-remove .ev-val, .view-before .find.is-remove .ev-val { color: var(--on-mark); }
body.intro:not(.no-intro) .s-report .find.is-remove .find-ev::before { animation: mark-in .5s var(--ease) both; animation-delay: calc(var(--i) * 80ms + .25s); }
@keyframes mark-in { from { transform: scaleX(0); } }
.find-why { font-size: .86rem; }
.find-state { display: none; }
.s-report .find.is-keep .find-text { color: var(--muted); font-weight: 500; }
.s-report .find.is-keep .find-icon { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--muted); }
.redact { display: none; }
.after-list .kept-always, .list .kept-always { margin-top: 12px; }
.tags summary { color: var(--accent); }
/* multi-line values: the marker can't be one scaled bar, so it fades instead */
.s-after .find-ev { white-space: normal; overflow: visible; }  /* long values wrap — never cut with “…” */
.find-ev.wrap::before { display: none; }
.find-ev.wrap .ev-val { background: var(--mark); border-radius: 4px; padding: 1px 4px; margin-left: -4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background-color .3s; }
.view-after .find.is-remove .find-ev.wrap .ev-val { background: transparent; }
/* modes */
.modes { margin: 0 0 12px; }
.modes-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; margin-bottom: 10px; }
.modes-label { font-weight: 700; }
.modes-note { color: var(--muted); font-size: .8rem; }
.mode-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mode { grid-template-columns: auto 1fr; gap: 10px; padding: 12px 14px; min-height: 58px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1.5px transparent; transition: transform .2s var(--ease-out), box-shadow .25s, background-color .25s; }
.mode:hover { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.mode:active { transform: scale(.97); }
.mode-icon { grid-row: auto; width: 32px; height: 32px; border-radius: 10px; background: var(--bg); transition: background-color .25s, color .25s; }
.mode-name { font-weight: 600; font-size: .92rem; line-height: 1.2; hyphens: auto; }
.mode-for { display: none; }
.mode.is-on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.mode.is-on .mode-icon { background: var(--accent); color: var(--on-accent); animation: pop .4s var(--ease-out); }
.mode-desc { display: block; margin: 10px 2px 0; color: var(--muted); font-size: .88rem; }
.custom-wrap { margin-top: 6px; }
.act-row { display: flex; gap: 8px; margin-bottom: 22px; }
.act-row .btn-clean { flex: 1; }
.mode-chip { background: var(--surface); box-shadow: var(--shadow); }
@media (min-width: 1000px) { .s-report .modes { display: block; } .s-report .pane-act .mode-chip { display: none; } }
@media (max-width: 999px) {
  .modes.is-open { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; margin: 0; max-height: 84dvh; overflow: auto; overscroll-behavior: contain;
    padding: 12px var(--gutter) calc(96px + env(safe-area-inset-bottom)); background: var(--bg); border-radius: 30px 30px 0 0;
    box-shadow: 0 0 0 100vmax rgba(5,14,16,.45); animation: sheet-up .42s var(--ease-out) both; }
  .modes.is-open::before { content: ''; display: block; width: 40px; height: 5px; border-radius: 99px; background: var(--line-strong); margin: 0 auto 14px; }
  .dock { z-index: 60; }
}
@keyframes sheet-up { from { transform: translateY(100%); } }

/* ---------- After: marker wipes away like an eraser, value fades, icon turns into a check ---------- */
.done-head { display: block; margin: 0 0 14px; }
.done-head .summary { margin: 2px 0 0; }
.ba { background: var(--surface); border-radius: 999px; padding: 4px; margin-bottom: 14px; box-shadow: var(--shadow); }
.ba-pill { inset: 4px calc(50% + 0px) 4px 4px; border-radius: 999px; background: var(--accent); }
.view-after .ba-pill { transform: translateX(calc(100% - 4px)); }
.ba [aria-selected="true"] { color: var(--on-accent); }
.view-after .find.is-remove .find-ev::before { transform: scaleX(0); transform-origin: right; }
.view-after .find.is-remove .ev-val { opacity: .45; text-decoration: line-through; text-decoration-thickness: 1.5px; transition: opacity .3s .15s; }
.view-after .find.is-remove .find-why { opacity: .55; }
.view-after .find.is-remove .find-icon { background: var(--ok); color: var(--on-ok); }
.view-after .find.is-remove .find-icon .ic-cat { display: none; }
.view-after .find.is-remove .find-icon .ic-done { display: inline-block; stroke-width: 2.4; }
.view-after .find.is-remove .find-state { display: inline-flex; grid-column: 2; padding: 2px 0 0; color: var(--ok); font-weight: 500; }
.find-state .ic { display: none; }
.erasing .view-after .find.is-remove .find-ev::before { animation: unmark .45s cubic-bezier(.6, 0, .2, 1) both; animation-delay: calc(var(--i) * 110ms + .5s); }
.erasing .view-after .find.is-remove .ev-val { animation: dim .35s ease both; animation-delay: calc(var(--i) * 110ms + .75s); }
.erasing .view-after .find.is-remove .find-icon { animation: pop .45s var(--ease-out) both; animation-delay: calc(var(--i) * 110ms + .8s); }
@keyframes unmark { from { transform: scaleX(1); transform-origin: right; } to { transform: scaleX(0); transform-origin: right; } }
@keyframes dim { from { opacity: 1; } to { opacity: .45; } }
.get { display: grid; gap: 10px; margin-bottom: 22px; }
.get .btn-get { width: 100%; }
.get-hint { margin: 0; font-size: .88rem; overflow-wrap: anywhere; }
.get-safe { margin: 0; color: var(--muted); font-size: .88rem; }
.get .btn-quiet { justify-self: start; padding: 0 .8em; margin-left: -.4em; }
@media (max-width: 640px) { .get .btn-get { display: none; } }

/* ---------- Batch: a gallery, status in text under each photo ---------- */
.s-batch { display: grid; gap: 16px; padding-block: 4px 24px; }
@media (min-width: 1000px) { .s-batch { grid-template-columns: minmax(0, 1fr) 320px; column-gap: 40px; align-items: start; } .s-batch .pane-act { position: sticky; top: 20px; } }
.batch-head .sec-title { margin-bottom: 4px; }
.gallery { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 180px), 1fr)); gap: 16px 14px; }
.tile { min-width: 0; animation: rise .4s var(--ease-out) both; animation-delay: calc(var(--i) * 40ms); }
.still .tile { animation: none; }
.tile-img { position: relative; aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.tile-img > img, .tile-img > svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .thumb-file .tf-bg { fill: var(--surface); }
.tile.is-skip .tile-img { opacity: .6; }
.tile-name { margin: 8px 4px 0; font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
.tile-meta { margin: 0 4px; color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.tile-st { display: flex; gap: 6px; align-items: flex-start; margin: 4px 4px 0; font-size: .84rem; }
.tile-st .ic { width: 1.05em; height: 1.05em; margin-top: .1em; }
.tile-st.geo { color: var(--warm); }
.tile-st.ok { color: var(--ok); }
.tile-st.muted { color: var(--muted); }
.phase-done .tile-st.ok { animation: rise .35s var(--ease-out) both; animation-delay: calc(var(--i) * 50ms); }
.play { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 99px; background: rgba(0,0,0,.4); }
.play::after { content: ''; position: absolute; left: 18px; top: 14px; border-left: 15px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.tile .icon-btn { position: absolute; right: 8px; bottom: 8px; background: var(--surface); box-shadow: 0 6px 16px -6px rgba(0,0,0,.4); }
.tile .bar { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 8px; background: rgba(255,255,255,.6); }
.batch-act { display: grid; gap: 10px; }
.batch-act .btn { width: 100%; }
.s-batch .pane-act > .mode-chip { width: 100%; margin-bottom: 10px; }
.s-batch .add { margin-top: 14px; color: var(--accent); }
@media (max-width: 440px) { .dock .mode-chip > span { display: none; } .dock .mode-chip { padding: 0 14px; } }  /* narrow phones: the chip keeps its icon, the button keeps its words */
@media (max-width: 640px) { .dock .all-hint { display: none; } .gallery { gap: 14px 10px; } .tile-img { border-radius: 18px; } }

/* ---------- Messages (unsupported, large) ---------- */
.s-msg { display: grid; place-items: start center; padding-block: clamp(10px, 7vh, 110px) 24px; }
.msg { width: min(100%, 620px); background: var(--surface); border-radius: 32px; box-shadow: var(--shadow); padding: clamp(24px, 3.4vw, 48px); }
.msg .file-head .thumb { width: 88px; border-radius: 18px; }
.msg .sec-title { margin-top: 24px; }
.msg-body { margin: 10px 0 0; font-size: 1.04rem; max-width: 50ch; }
.msg-meta { color: var(--muted); font-size: .88rem; }
.msg-tip { background: var(--warm-soft); padding: 14px 16px; border-radius: 18px; }
.msg-tip .ic { color: var(--warm); }
.big-progress { margin-top: 24px; }
.bp-track { height: 12px; }
.bp-pct { font-family: var(--font-display); font-weight: 500; font-size: 2.8rem; line-height: 1.05; letter-spacing: -.03em; }
.s-large .done-head { display: flex; margin-top: 24px; }
.done-badge .ic { stroke-width: 2.4; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
const lang = () => (document.documentElement.lang === 'en' ? 'en' : 'ru');
const x = (k) => UM.t({ note: 'start.labelNote', pickMedia: 'start.chooseMedia', pickFiles: 'start.chooseDocs', hint: 'start.multipleHintMobile', saved: 'actions.saved', none: 'batch.nothingHidden', cant: 'batch.cantClean' }[k]);
const finds = (n) => UM.t('batch.findings', { count: n });
const photo = (f) => `<figure class="photo" style="view-transition-name:hero">${UM.thumb(f.kind, 0, f.url)}</figure>`;
// the marker is one scaled bar for one-line values; values that wrap get a plain background instead
const markWraps = () => document.querySelectorAll('.find-ev').forEach((el) => {
  const v = el.querySelector('.ev-val'); if (v && v.getClientRects().length > 1) el.classList.add('wrap');
});

window.DIR = {
  name: 'E · Фото и текст',
  sheet: true,
  after: markWraps,
  screens: {
    start() {
      const { t, btn, ic, S, mobile, L } = UM, f = S.file;
      const rows = ['where', 'phone', 'when', 'author'].map((k) => [t(`start.example.${k}`), t(`start.example.${k}Value`)]);
      return `<section class="screen s-start">
        <div class="hero">
          <h1 class="hero-title">${t('start.title')}</h1>
          <p class="hero-sub">${t('start.subtitle')}</p>
          <div class="hero-act">
            ${btn('pick', mobile() ? x('pickMedia') : t('start.choose'), 'btn-primary btn-pick', 'upload')}
            <p class="hint">${mobile() ? x('hint') : t('start.multipleHint')}</p>
          </div>
        </div>
        <div class="stage drop" data-action="pick" role="button" tabindex="0" aria-label="${t('a11y.dropzone')}">
          ${photo(f)}
          <div class="label" aria-hidden="true">
            <div class="label-head"><span class="label-name">${f.name}</span><span class="label-note">${x('note')}</span></div>
            <dl>${rows.map(([k, v], i) => `<div class="label-row" style="--i:${i}"><dt>${k}</dt><dd><span>${v}</span></dd></div>`).join('')}</dl>
          </div>
        </div>
        <div class="start-extra">
          <p class="privacy-line">${ic('lock')}<span>${t('start.privacy')} <a href="#">${t('start.privacyLink')}</a></span></p>
          <details class="what"><summary>${t('start.whatIsHidden')}${ic('chevron')}</summary><p>${t('start.whatIsHiddenBody')}</p></details>
          ${mobile() ? `<button type="button" class="link-btn pick-files" data-action="pickFiles">${ic('upload', 'inline')}${x('pickFiles')}</button>` : ''}
          <button type="button" class="link-btn" data-action="demo">${t('start.tryExample')}</button>
        </div>
        <div class="dock">${btn('pick', x('pickMedia'), 'btn-primary btn-block', 'upload')}<p class="hint">${x('hint')}</p></div>
      </section>`;
    },
    report() {
      const { t, S, ic, size, modePicker, modeChip, btn, rowsHtml, details } = UM, f = S.file;
      return `<section class="screen s-report">
        <div class="pane pane-file">${photo(f)}<p class="file-line"><b>${f.name}</b>${size(f.bytes)}</p></div>
        <div class="pane pane-act">
          <h1 class="sec-title">${t('report.title')}</h1>
          <p class="summary">${t('report.summary', { count: Object.keys(f.found).length })}</p>
          ${modePicker()}
          <div class="act-row">${modeChip()}${btn('clean', t('actions.clean'), 'btn-primary btn-clean', 'eraser')}</div>
          <div class="card list">${rowsHtml(f, 'report')}<p class="kept-always">${ic('info')}${t('report.alwaysKept')}</p>${details(f)}</div>
        </div>
        <div class="dock">${modeChip()}${btn('clean', t('actions.clean'), 'btn-primary btn-clean', 'eraser')}</div>
      </section>`;
    },
    after() {
      const { t, S, ic, btn, rowsHtml, active, mobile } = UM, f = S.file, set = active();
      const kept = Object.keys(f.found).filter((c) => !set.has(c));
      const name = set.has('filename') ? `${f.neutral}_clean.heic` : f.name.replace(/\.(\w+)$/, (_, e) => `_clean.${e.toLowerCase()}`);
      const getBtn = (cls) => btn('save', S.saved ? x('saved') : (mobile() ? t('actions.save') : t('actions.download')), `btn-primary btn-get ${cls} ${S.saved ? 'is-done' : ''}`, S.saved ? 'check' : (mobile() ? 'share' : 'download'));
      return `<section class="screen s-after view-${S.view}">
        <div class="pane pane-file">${photo(f)}<p class="file-line"><b>${f.name}</b>${ic('arrow')}<b>${name}</b></p></div>
        <div class="pane pane-act">
          <div class="done-head"><h1 class="sec-title">${t('result.done')}</h1><p class="summary">${kept.length ? t('result.verifiedKept') : t('result.verified')}</p></div>
          <div class="get">${getBtn('')}
            <p class="get-hint">${mobile() ? t('actions.saveHint') : t('result.newName', { name })}</p>
            <p class="get-safe">${t('result.originalSafe')}</p></div>
          <div class="ba" role="tablist" aria-label="${t('result.before')} / ${t('result.after')}">
            <button type="button" role="tab" aria-selected="${S.view === 'before'}" data-action="view" data-view="before">${t('result.before')}</button>
            <button type="button" role="tab" aria-selected="${S.view === 'after'}" data-action="view" data-view="after">${t('result.after')}</button>
            <span class="ba-pill" aria-hidden="true"></span></div>
          <div class="card list after-list">${rowsHtml(f, 'after')}<p class="kept-always">${ic('info')}${t('result.leftover')} ${t('report.alwaysKept')}</p></div>
          ${btn('home', t('actions.startOver'), 'btn-quiet')}
        </div>
        <div class="dock">${getBtn('btn-block')}</div>
      </section>`;
    },
    batch() {
      const { t, S, ic, size, thumb, btn, modeChip, mobile, L } = UM, B = S.batch, ph = S.batchPhase;
      const cleanable = B.filter((f) => !f.unsupported && !f.plain), geo = B.filter((f) => f.found.includes('location')).length;
      const total = B.reduce((a, f) => a + (f.unsupported ? 0 : f.bytes), 0);
      const tiles = B.map((f, i) => {
        const st = f.unsupported ? `<p class="tile-st muted">${ic('info')}${x('cant')}</p>`
          : f.plain ? `<p class="tile-st muted">${ic('check')}${x('none')}</p>`
          : ph === 'done' ? `<p class="tile-st ok">${ic('check')}${t('result.done')}</p>`
          : f.found.includes('location') ? `<p class="tile-st geo">${ic('location')}${t('batch.hasLocation')} · ${finds(f.found.length)}</p>`
          : `<p class="tile-st">${finds(f.found.length)}</p>`;
        return `<li class="tile ${f.unsupported ? 'is-skip' : ''}" style="--i:${i}">
          <div class="tile-img">${thumb(f.kind, i, f.url)}${f.kind === 'video' && f.url ? '<span class="play" aria-hidden="true"></span>' : ''}
            ${ph === 'cleaning' && !f.unsupported && !f.plain ? `<span class="bar"><span class="bar-fill" style="--d:${0.5 + (i % 4) * 0.25}s;--delay:${i * 0.12}s"></span></span>` : ''}
            ${ph === 'done' && !f.unsupported && !f.plain ? `<button type="button" class="icon-btn" data-action="noop" aria-label="${t('actions.download')} ${f.name}">${ic(mobile() ? 'share' : 'download')}</button>` : ''}</div>
          <p class="tile-name">${f.name}</p><p class="tile-meta">${size(f.bytes)}</p>${st}</li>`;
      }).join('');
      const head = ph === 'done' ? `${t('batch.cleaned', { count: cleanable.length })}. ${t('batch.skipped', { count: B.filter((f) => f.unsupported).length })}`
        : `${t('batch.files', { count: B.length })}. ${t('batch.withLocation', { count: geo })}`;
      const action = ph === 'done' ? `${btn('noop', t('actions.downloadAll'), 'btn-primary btn-all', mobile() ? 'share' : 'download')}<span class="all-hint">${t('actions.downloadAllHint')}, ${size(total)}</span>`
        : ph === 'cleaning' ? `<span class="all-progress">${t('progress.cleaning')}</span>` : btn('cleanBatch', t('actions.cleanCount', { count: cleanable.length }), 'btn-primary btn-clean', 'eraser');
      return `<section class="screen s-batch phase-${ph}">
        <div class="pane pane-file"><div class="batch-head"><h1 class="sec-title">${ph === 'done' ? t('result.done') : t('report.title')}</h1><p class="summary">${head}</p></div>
          <ul class="gallery" role="list">${tiles}</ul>
          <button type="button" class="link-btn add" data-action="noop">${ic('plus')}${t('actions.addMore')}</button></div>
        <div class="pane pane-act">${ph === 'found' ? modeChip() : ''}<div class="batch-act">${action}</div></div>
        <div class="dock">${ph === 'found' ? modeChip() : ''}${action}</div>
      </section>`;
    },
  },
};
})();
</script>
<script src="icons.js"></script>
<script src="copy.js"></script>
<script src="shared.js"></script>
</body>
</html>
